[project]
name = "mcp-kicad10"
version = "0.2.0"
description = "MCP server para KiCad 10 — IPC API (kipy) + kicad-cli, com regras de fabricação JLCPCB embutidas"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Thalis Antunes" }]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

dependencies = [
    "mcp>=2.0.0,<3",
    "kicad-python>=0.7.1,<1",
]

# Os dois nomes: `mcp-kicad` para `uv run`, `mcp-kicad10` (o nome da distribuição)
# para `uvx mcp-kicad10`, que só acha executável com o nome do pacote.
[project.scripts]
mcp-kicad = "mcp_kicad.__main__:main"
mcp-kicad10 = "mcp_kicad.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_kicad"]

# As regras .kicad_dru viajam junto com o pacote — a tool jlcpcb_apply_rules
# depende disso para achá-las via importlib.resources.
[tool.hatch.build.targets.wheel.force-include]
"rules" = "mcp_kicad/_rules"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: usa o kicad-cli real e os projetos de demo do KiCad (pula sozinho se ausentes)",
]
